name: Compilar APK de DRACUVERSUS

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Generar APK de DRACUVERSUS
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Android SDK y licencias
        uses: android-actions/setup-android@v3

      - name: Preparar firma de depuración
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Ejecutar pruebas unitarias y compilar APK
        run: gradle :app:testDebugUnitTest --tests com.example.ExampleUnitTest :app:assembleDebug

      - name: Preparar archivo Dracuversus.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk Dracuversus.apk

      - name: Subir Dracuversus-APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Dracuversus-APK
          path: Dracuversus.apk
          if-no-files-found: error

      - name: Publicar APK directo en GitHub Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk Dracuversus.apk --clobber
          else
            gh release create latest-apk Dracuversus.apk --title "DRACUVERSUS APK" --notes "APK instalable de DRACUVERSUS compilado automáticamente."
          fi
